<div class="mb-8 mx-4 md:mx-10 my-8">
  <div class="flex justify-between items-center pr-4 mb-4">
    <div class="flex items-center gap-2">
      <img [src]="section().icon" [alt]="section().title" class="w-6 h-6" />
      <h2 class="text-[18px] font-bold text-gray-800">{{ section().title }}</h2>
    </div>
    <div>
      <div class="flex items-center">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512" fill="#000" stroke="black" class="w-4 h-4">
          <path
            d="M310.6 233.4c12.5 12.5 12.5 32.8 0 45.3l-192 192c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3L242.7 256 73.4 86.6c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0l192 192z">
          </path>
        </svg>
      </div>
    </div>
  </div>

  <!-- Record Carousel Container -->
  <div class="relative">
    <!-- Navigation Buttons -->
    <button (click)="scrollLeft()"
      class="absolute left-0 top-1/2 transform -translate-y-1/2 z-10 bg-white rounded-full shadow-lg p-2 hover:bg-gray-50 transition-colors duration-200 md:flex items-center justify-center cursor-pointer"
      style="width: 40px; height: 40px; margin-left: -15px">
      <svg viewBox="0 0 24 24" class="w-5 h-5 text-black">
        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="currentColor" />
      </svg>
    </button>

    <button (click)="scrollRight()"
      class="absolute right-0 top-1/2 transform -translate-y-1/2 z-10 bg-white rounded-full shadow-lg p-2 hover:bg-gray-50 transition-colors duration-200 md:flex items-center justify-center cursor-pointer"
      style="width: 40px; height: 40px; margin-right: -15px">
      <svg viewBox="0 0 24 24" class="w-5 h-5 text-black">
        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" fill="currentColor" />
      </svg>
    </button>

    <!-- Carousel Content -->
    @if (isLoadingRecap()) {
      <div class="flex space-x-2 md:space-x-4 pb-4" style="width: max-content">
        @for (skeleton of [0,1,2,3,4]; track skeleton) {
          <div class="relative flex flex-col w-[500px] group cursor-pointer animate-pulse" style="flex-shrink: 0; scroll-snap-align: start">
            <div class="relative overflow-hidden rounded-lg bg-gray-200 aspect-video w-full h-full mb-2"></div>
            <div class="font-semibold mt-2 truncate text-[14px]">
              <div class="h-4 w-2/3 bg-gray-300 rounded"></div>
            </div>
          </div>
        }
      </div>
    } @else {
      <div #carousel class="overflow-x-auto scrollbar-hidden"
        style="scroll-snap-type: x mandatory; scrollbar-width: none; -ms-overflow-style: none">
        <div class="flex space-x-2 md:space-x-4 pb-4" style="width: max-content">
          @for (record of section().data; track record.videoId) {
          <div class="relative flex flex-col w-[500px] group cursor-pointer"
            style="flex-shrink: 0; scroll-snap-align: start">
            <div class="relative overflow-hidden rounded-lg">
              @if (record.source == 'youtube') {
                <img class="rounded-lg drop-shadow-lg aspect-video w-full h-full object-cover transition-transform duration-300 transform group-hover:scale-110"
                  [src]="'//img.youtube.com/vi/' + record.sourceId + '/mqdefault.jpg'" [attr.id]="'img_' + record.videoId"
                  (load)="checkImage($event, record)" [attr.alt]="record.title" />
              } @else if (record.source == 'vimeo') {
                <img class="rounded-lg drop-shadow-lg aspect-video w-full h-full object-cover transition-transform duration-300 transform group-hover:scale-110"
                  [src]="record.screenshot" [attr.id]="'img_' + record.videoId"
                  (error)="errorImage($event, record)" (load)="checkImage($event, record)"
                  [attr.alt]="record.title" />
              } @else {
                <img [src]="record.image" [alt]="record.title" loading="lazy"
                  class="rounded-lg aspect-video w-full h-full object-cover transition-transform duration-300 transform group-hover:scale-110" />
              }
              <div class="absolute inset-0 flex items-center justify-center">
                <a [href]="record.audio1" class="hover:opacity-75 transition-opacity duration-200">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="white" class="w-8 h-8">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3l14 9-14 9V3z"></path>
                  </svg>
                </a>
              </div>
            </div>
            <div class="font-semibold mt-2 truncate text-[14px]">{{ record.title }}</div>
          </div>
          }
        </div>
      </div>
    }
  </div>
</div>
