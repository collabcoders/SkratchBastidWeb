<div class="event-card hover-effect flex h-full flex-col overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm w-full">
  <div class="relative h-56 w-full bg-gray-100">
    @if (event().image) {
      <img
        class="h-full w-full object-cover"
        [src]="event().image"
        [alt]="event().title || 'Event image'"
        loading="lazy"
      />
    } @else {
      <div class="flex h-full w-full items-center justify-center bg-gradient-to-br from-gray-50 to-gray-200 text-sm font-semibold text-gray-400">
        Image coming soon
      </div>
    }
  </div>

  <div class="flex flex-1 flex-col gap-3 p-5">
    @if (event().tickets || event().url) {
      <a
        class="event-card__link inline-flex w-fit items-center gap-2 rounded-full bg-[#FF5941] px-4 py-2 text-xs font-bold uppercase tracking-wide text-white mx-auto"
        [href]="event().tickets || event().url"
        target="_blank"
        rel="noopener noreferrer"
      >
        Tickets & More
        <span aria-hidden="true">↗</span>
      </a>
    }

    <div class="flex flex-col gap-1">
      <h3 class="text-lg font-semibold leading-snug text-gray-900">{{ event().title }}</h3>
      <div class="text-xs font-semibold uppercase tracking-wide text-[#FF5941]">
        @if (event().date) {
          {{ event().date | date: 'MMM d, y' }}
        } @else {
          Date TBA
        }
      </div>
    </div>

    @if (event().location) {
      <div class="text-sm font-medium text-gray-600">{{ event().location }}</div>
    }
  </div>
</div>
