<div class="bg-[#fff] text-white md:px-12 px-6 py-12 flex flex-col-reverse md:flex-row items-center gap-24">
  <div class="flex-1 md:w-70 flex flex-col gap-4">
    <img src="/img/bbqimg2.jpg" alt="Image 1" class="rounded-lg w-full h-[50vh] object-cover" />
  </div>
  <div class="flex-1 md:w-30 text-[#142129]">
    <h2 class="text-3xl font-bold">Sign Up for Bastid's BBQ</h2>
    <p class="mt-2 text-gray-300 mb-4 font-light"></p>
    <div class="flex flex-col">
      <div>
        <form class="bbq-signup-form space-y-4" (ngSubmit)="onSubmit()" #signupForm="ngForm" novalidate>
          <input
            data-HIVE-FORM-FIELD="swid"
            type="hidden"
            [value]="hiveInitId"
          />

          <input
            data-HIVE-FORM-FIELD="email"
            [(ngModel)]="formData.email"
            name="email"
            type="email"
            placeholder="Email"
            required
            class="w-full px-4 py-3 border rounded-lg focus:ring text-[#142129] focus:ring-[#FF5941]"
          />

          <input
            data-HIVE-FORM-FIELD="firstName"
            [(ngModel)]="formData.name"
            name="name"
            type="text"
            placeholder="Full Name"
            required
            class="w-full px-4 py-3 border rounded-lg focus:ring text-[#142129] focus:ring-[#FF5941]"
          />

          <input
            data-HIVE-FORM-FIELD="phoneNumber"
            data-HIVE-INTL-PHONE-NUMBER="true"
            [(ngModel)]="formData.phone"
            name="phone"
            type="tel"
            placeholder="Phone Number"
            required
            class="w-full px-4 py-3 border rounded-lg focus:ring text-[#142129] focus:ring-[#FF5941]"
          />

          <select
            data-HIVE-FORM-FIELD="city"
            [(ngModel)]="formData.city"
            name="city"
            required
            class="w-full px-4 py-3 border rounded-lg focus:ring text-[#142129] focus:ring-[#FF5941]"
          >
            <option value="" disabled>Select Your City</option>
            @for (city of cities; track city) {
              <option [value]="city">{{ city }}</option>
            }
          </select>

          <input
            data-HIVE-FORM-FIELD="zipCode"
            [(ngModel)]="formData.zip"
            name="zip"
            type="text"
            placeholder="Postal/Zip Code"
            required
            class="w-full px-4 py-3 border rounded-lg focus:ring text-[#142129] focus:ring-[#FF5941]"
          />

          <input data-HIVE-FORM-FIELD="addToSegment" type="hidden" value="Signup Form - Homepage" />
          <input data-HIVE-FORM-FIELD="addToSegment" type="hidden" value="VIP Free Trial" />

          <div style="position: absolute; left: -5000px;" aria-hidden="true">
            <input type="text" data-HIVE-FORM-FIELD="areUReal" tabindex="-1" value="" />
          </div>

          <button
            type="submit"
            data-HIVE-FORM-FIELD="submitButton"
            [disabled]="isSubmitting || signupForm.invalid"
            class="w-full bg-[#FF5941] text-white py-3 !rounded-lg font-bold hover:bg-orange-600 transition border border-orange-500 disabled:opacity-70 disabled:cursor-not-allowed"
          >
            {{ isSubmitting ? 'Submitting...' : 'Sign Up' }}
          </button>

          @if (errorMessage) {
            <p class="text-red-500 text-center mt-2">{{ errorMessage }}</p>
          }

          @if (successMessage) {
            <p class="text-green-500 text-center mt-2">{{ successMessage }}</p>
          }
        </form>
      </div>
    </div>
  </div>
</div>
