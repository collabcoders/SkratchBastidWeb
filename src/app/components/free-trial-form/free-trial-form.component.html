@if (!(isLoggedIn$ | async)) {
<!-- Free Trial Form Section -->
<div [class]="containerClasses() + (showTopMargin() ? ' mt-8' : '')">
  <div class="relative z-10 text-center mb-8">
    <h1 class="text-3xl font-bold uppercase mb-2 text-black">Try it for free</h1>
    <p class="text-gray-600 text-base mb-6 mx-auto max-w-xs">
      Wanna have a taste of the Top Grillin' Experience? Sign up for a free trial (no card info
      required).
      <a href="#" class="underline text-[#FF5941]">Privacy Policy</a>. By clicking above, you agree
      we may process your info per these terms.
    </p>
  </div>

  <form #hiveForm class="hive-signup-form" (ngSubmit)="onSubmit()" novalidate>
    <input data-HIVE-FORM-FIELD="swid" type="hidden" [value]="hiveInitId" />

    <label for="_HIVE-email-9308">Email</label>
    <input
      data-HIVE-FORM-FIELD="email"
      id="_HIVE-email-9308"
      name="email"
      type="email"
      [(ngModel)]="email"
      placeholder="Enter an email..."
      autocomplete="email"
      required
    />

    <label for="_HIVE-firstName-9308">First Name</label>
    <input
      data-HIVE-FORM-FIELD="firstName"
      id="_HIVE-firstName-9308"
      name="fname"
      type="text"
      [(ngModel)]="firstName"
      placeholder="Enter a first name..."
      autocomplete="given-name"
    />

    <label for="_HIVE-lastName-9308">Last Name</label>
    <input
      data-HIVE-FORM-FIELD="lastName"
      id="_HIVE-lastName-9308"
      name="lname"
      type="text"
      [(ngModel)]="lastName"
      placeholder="Enter a last name..."
      autocomplete="family-name"
    />

    <label for="_HIVE-phoneNumber-9308">Phone Number</label>
    <input
      data-HIVE-FORM-FIELD="phoneNumber"
      data-HIVE-INTL-PHONE-NUMBER="true"
      id="_HIVE-phoneNumber-9308"
      name="phone"
      type="tel"
      [(ngModel)]="phoneNumber"
      placeholder="Enter a phone number..."
      autocomplete="tel"
    />

    <input data-HIVE-FORM-FIELD="addToSegment" type="hidden" value="Signup Form - Homepage" />
    <input data-HIVE-FORM-FIELD="addToSegment" type="hidden" value="VIP Free Trial" />

    <div style="position: absolute; left: -5000px;" aria-hidden="true">
      <input type="text" data-HIVE-FORM-FIELD="areUReal" tabindex="-1" value="" />
    </div>

    <button
      type="submit"
      data-HIVE-FORM-FIELD="submitButton"
      class="mt-4"
      [disabled]="isSubmitting"
    >
      {{ isSubmitting ? 'Submitting...' : 'Start your free trial' }}
    </button>
  </form>
</div>
}
