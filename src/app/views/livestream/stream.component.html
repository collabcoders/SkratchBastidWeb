<app-header></app-header>

<div class="mt-[80px]">
  <!-- Page Title -->
  <div class="mx-4 md:mx-10">
    <div class="flex items-center gap-3">
      <img src="/img/livestreamImg.png" alt="Livestream" class="w-8 h-8" />
      <h2 class="text-[28px] md:text-[36px] font-bold text-gray-800">Top Grillin' Livestream</h2>
    </div>
  </div>

  <div class="stream" id="stream">
      <div class="row">
          <div class="col-md-12 tite-col">
              <div class="ls-container">
                  <div class="ls-player-container">
                      <div class="ls-player-wrapper">
                          <mux-player
                              class="ls"
                              autoplay="any"
                              allow="fullscreen"
                              [attr.poster]="offline_livestream_placehoder"
                              stream-type="live"
                              [attr.playback-id]="stream"
                              metadata-video-title="Top Grillin' Livestream"
                              controls>
                          </mux-player>
                      </div>
                  </div>
                  <div class="ls-chat-container">
                      <iframe [src]="(chat || '') | safe" class="ls" allowTransparency="true"></iframe>
                  </div>
              </div>
          </div>
      </div>
  </div>

  <app-footer></app-footer>
</div>
