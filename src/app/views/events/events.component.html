<app-header></app-header>

<div class="mt-[58px]">
  <div class="bg-white bg-cover bg-no-repeat w-full min-h-[95vh]">
    <div class="mb-8 mx-4 md:mx-10 mt-12 pt-8">
      <h1 class="text-[18px] font-bold text-gray-800">Upcoming Shows</h1>
      <div class="">
        @if (isLoadingEvent()) {
          @for (skeleton of [0,1,2]; track skeleton) {
            <div class="animate-pulse mb-4 p-4 rounded-lg bg-gray-100 flex flex-col gap-2">
              <div class="h-6 w-1/3 bg-gray-300 rounded"></div>
              <div class="h-4 w-1/2 bg-gray-200 rounded"></div>
              <div class="h-4 w-1/4 bg-gray-200 rounded"></div>
              <div class="h-32 w-full bg-gray-200 rounded"></div>
            </div>
          }
        } @else {
          @for (event of upcomingEvents; track event.eventId) {
            <app-event-card [event]="event"></app-event-card>
          }
          @if (upcomingEvents.length === 0) {
            <div class="flex flex-col items-center justify-center py-16 bg-gray-50 rounded-lg shadow-inner mx-4 my-6">
              <div class="text-lg font-semibold text-gray-700 mb-1">No Upcoming Events</div>
              <div class="text-sm text-gray-500">Check back soon for new show announcements!</div>
            </div>
          }
        }
      </div>
    </div>

    <!-- Free Trial Form -->
    <app-free-trial-form></app-free-trial-form>

    <!-- Bottom Image Section -->
    <div class="bg-white relative">
      <img src="/img/bottom_image.png" alt="Bottom Image" class="bottom-0 left-0 w-full object-cover" />
    </div>

    <!-- Footer -->
    <app-footer></app-footer>
  </div>
</div>
