@if (isVisible()) {
  <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4"
       (click)="onBackdropClick($event)">

    <!-- Modal Content -->
    <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full mx-4 p-4 relative">


      <!-- Left side: VIP Icon + Title -->
      <div class="flex items-start gap-6">
        <!-- VIP Icon -->
        <div class="flex-shrink-0">
          <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center">
            <svg class="w-8  h-8 text-blue-600" fill="currentColor" viewBox="0 0 24 24">
              <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
          </div>
        </div>

        <!-- Content -->
        <div class="flex-1">
          <!-- Title -->
          <p class="text-lg font-semibold text-gray-900 mb-2">
            VIP Members Only Stream
          </p>

          <!-- Description -->
          <p class="text-gray-600 text-sm mb-8 leading-relaxed">
            VIP members only. Please login or create an account to access this content.
            <!-- This stream is for Top Grillin' VIP members only. Please login or create an account to access this content. -->
          </p>
        </div>
      </div>

      <!-- Bottom section with buttons -->
      <div class="flex items-center justify-between">
        <!-- Maybe Later Link -->
        <button
          (click)="onMaybeLater()"
          class="text-gray-500 !text-sm hover:text-gray-700 font-medium transition-colors duration-200">
          Maybe later
        </button>

        <!-- Action Buttons -->
        <div class="flex gap-3">
          <button
            (click)="onSignIn()"
            class="bg-gray-100 !text-sm hover:bg-gray-200 text-gray-800 font-semibold py-2 px-4 !rounded-lg transition-colors duration-200">
            Sign In
          </button>
          <button
            (click)="onJoinVip()"
            class="bg-blue-600 !text-sm hover:bg-blue-700 text-white font-semibold py-2 px-4 !rounded-lg transition-colors duration-200">
            Join VIP
          </button>
        </div>
      </div>
    </div>
  </div>
}
